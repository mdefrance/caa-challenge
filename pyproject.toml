[project]
name = "caa-challenge"
version = "0.1.0"
description = "Winning solution to the CAA / ENS claim frequency-severity data challenge (#161)"
authors = [{ name = "Mario Defrance", email = "74489838+mdefrance@users.noreply.github.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xgboost>=2.1.4",
    # The 2026 arm is measured on AutoCarver 7.7.3. The 2025 arm ran on 7.0.5 and is
    # reproduced only by the timed baseline notebooks, which need their own environment
    # (see README.md) -- 7.0.5 and the current line are not API-compatible.
    "autocarver[jupyter]>=7.7.3",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "pandas>=2.2.3,<3",
    "scikit-learn>=1.6.1",
    "jinja2>=3.1.5",
    "optuna>=4.2.1",
    "openpyxl>=3.1.5",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.1.2",
    "flake8-pyproject>=1.2.3",
    "pylint>=3.3.5",
    "isort>=6.0.1",
    "nbconvert>=7.17.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E704"]

[tool.pylint.basic]
good-names = ["X", "y"]

[tool.pylint.messages_control]
disable = ["C0301", "C0103", "E0110", "W0621", "import-error"]
